[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bamboo"
version = "1.1.0"
description = "Bamboo — lightweight MCP-based runtime with a plugin architecture for AI-assisted scientific tools."
requires-python = ">=3.10"
# mcp upper bound: 2.0.0 removed the low-level Server decorator API used by
# core.build_server(). See requirements.txt for detail.
dependencies = ["mcp>=1.10.0,<2.0.0", "python-dotenv>=1.0.0"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["bamboo*", "interfaces*"]

# Console scripts shipped with the root package.  The module form
# (python -m interfaces.agent.job_agent) always works from a source checkout;
# this is the ergonomic equivalent for an installed deployment.
[project.scripts]
bamboo-job-agent = "interfaces.agent.job_agent.cli:main"

[tool.askpanda]
default_namespace = "atlas"

# Entry points for tools shipped with the root package (if any).
# Plugin packages (e.g. packages/askpanda_atlas) register their own entry
# points under bamboo.tools in their own pyproject.toml.
# [project.entry-points."bamboo.tools"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
